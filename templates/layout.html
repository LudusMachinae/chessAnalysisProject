<html lang="en" data-bs-theme="dark">
    <head>
        <!--bootstrap stuff-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <link href="https://fonts.googleapis.com/css?family=Exo+2" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!--my stuff :) -->
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
        <!--additional stuff-->
        {% block head %} {% endblock %}
        <title>{% block title %} {% endblock %}</title>
    </head>
    <body>
      <!-- Everything in this 'nav' is the top navigation bar -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
              <a class="navbar-brand bb" href="/"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="logo" width="40" height="40" style="margin-right:10px">Chessboard</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>

              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                {% if session["user_id"] %}
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/">placeholder1</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/">placeholder2</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/">placeholder</a>
                        </li>
                    </ul>
                {% else %}
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="/register">Register</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/login">LOG IN</a>
                        </li>
                    </ul>
                {% endif %}
              </div>
            </div>
        </nav>
        <main>
            
            {% block main %}{% endblock %}

        </main>
        {% block script %} {% endblock %}
  </body>
</html>
